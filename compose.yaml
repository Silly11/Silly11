services:
  web:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env.local
    environment:
      DATA_DIR: /app/data
    volumes:
      - cosmic-data:/app/data
    restart: unless-stopped
  worker:
    build: .
    command: npm run worker
    env_file: .env.local
    environment:
      DATA_DIR: /app/data
    volumes:
      - cosmic-data:/app/data
    restart: unless-stopped
volumes:
  cosmic-data:
